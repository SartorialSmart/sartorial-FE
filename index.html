<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OLIFNG - Launching Soon</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4a6cf7;
      --secondary: #ff6b6b;
      --dark: #1e293b;
      --light: #f8fafc;
      --accent: #f59e0b;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: var(--light);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-attachment: fixed;
    }

    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 3rem 2rem;
      text-align: center;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      animation: fadeIn 1s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 0.5rem;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .subheading {
      font-size: 1.3rem;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 2.5rem;
      line-height: 1.6;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    .launch-badge {
      display: inline-block;
      background: rgba(245, 158, 11, 0.2);
      color: var(--accent);
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-weight: 600;
      margin-bottom: 2.5rem;
      border: 1px solid rgba(245, 158, 11, 0.3);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .contact {
      margin: 2.5rem 0;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .contact-item {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .contact-icon {
      margin-right: 10px;
      color: var(--primary);
    }

    .socials {
      margin-top: 2.5rem;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }

    .socials a {
      color: var(--light);
      font-size: 1.8rem;
      text-decoration: none;
      transition: all 0.3s ease;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .socials a:hover {
      transform: translateY(-5px) scale(1.1);
      background: var(--primary);
      box-shadow: 0 10px 20px rgba(74, 108, 247, 0.3);
    }

    .footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.6);
    }

    /* Countdown timer - optional */
    .countdown {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .countdown-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 1rem;
      border-radius: 10px;
      min-width: 80px;
    }

    .countdown-number {
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
    }

    .countdown-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
        margin: 1rem;
      }

      h1 {
        font-size: 2.5rem;
      }

      .subheading {
        font-size: 1.1rem;
      }

      .socials {
        gap: 1rem;
      }

      .socials a {
        width: 45px;
        height: 45px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
