name: Deploy Frontend to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: satorial/package-lock.json

      - name: Install dependencies
        working-directory: satorial
        run: npm ci

      - name: Build
        working-directory: satorial
        env:
          VITE_BASE_URL: ${{ secrets.VITE_BASE_URL }}
        run: npm run build

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: caliban
          key: ${{ secrets.SSH_KEY }}
          source: "satorial/dist/"
          target: "~/sartorial-FE"
          strip_components: 2

      - name: Reload Nginx
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: caliban
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo systemctl reload nginx
